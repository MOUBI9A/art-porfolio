name: Security dependency remediation

on:
  push:
    branches:
      - security/dependency-remediation-2026-10-19

permissions:
  contents: write

jobs:
  remediate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: security/dependency-remediation-2026-10-19
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install cleanly
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Capture production dependency audit
        run: |
          npm audit --omit=dev --json > audit.json || true
          mkdir -p docs
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          const summary = audit.metadata?.vulnerabilities || {};
          const rows = Object.values(audit.vulnerabilities || {})
            .filter((v) => ['critical', 'high', 'moderate'].includes(v.severity))
            .sort((a, b) => ({critical: 0, high: 1, moderate: 2}[a.severity] ?? 9) - ({critical: 0, high: 1, moderate: 2}[b.severity] ?? 9))
            .map((v) => `| ${v.name} | ${v.severity} | ${v.isDirect ? 'yes' : 'no'} | ${String(v.range).replaceAll('|', '\\|')} | ${typeof v.fixAvailable === 'object' ? `${v.fixAvailable.name}@${v.fixAvailable.version}${v.fixAvailable.isSemVerMajor ? ' (major)' : ''}` : String(v.fixAvailable)} |`);
          const md = [
            '# Dependency audit — 2026-10-19',
            '',
            'Generated by the branch security-remediation workflow after lockfile regeneration and a clean install.',
            '',
            `- critical: ${summary.critical ?? 0}`,
            `- high: ${summary.high ?? 0}`,
            `- moderate: ${summary.moderate ?? 0}`,
            `- low: ${summary.low ?? 0}`,
            '',
            '| Package | Severity | Direct | Affected range | Fix available |',
            '| --- | --- | --- | --- | --- |',
            ...(rows.length ? rows : ['| none | — | — | — | — |']),
            '',
            'Tailwind 3 is intentionally not force-upgraded to Tailwind 4 in this remediation.',
            ''
          ].join('\n');
          fs.writeFileSync('docs/DEPENDENCY_AUDIT_2026-10-19.md', md);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          NODE

      - name: Capture lint result
        id: lint
        shell: bash
        run: |
          set +e
          npm run lint > lint.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Capture typecheck result
        id: typecheck
        shell: bash
        run: |
          set +e
          npx tsc --noEmit > typecheck.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Capture build result
        id: build
        shell: bash
        env:
          NEXT_PUBLIC_AUTH_ENABLED: "false"
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write validation evidence
        env:
          LINT_EXIT: ${{ steps.lint.outputs.exit_code }}
          TYPECHECK_EXIT: ${{ steps.typecheck.outputs.exit_code }}
          BUILD_EXIT: ${{ steps.build.outputs.exit_code }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const tail = (path, max = 12000) => {
            if (!fs.existsSync(path)) return '(no output)';
            const text = fs.readFileSync(path, 'utf8');
            return text.length > max ? `…truncated…\n${text.slice(-max)}` : text;
          };
          const fence = (s) => `\`\`\`text\n${s.replaceAll('```', '``` ')}\n\`\`\``;
          const md = [
            '# Dependency validation — 2026-10-19',
            '',
            `- lint exit: ${process.env.LINT_EXIT}`,
            `- typecheck exit: ${process.env.TYPECHECK_EXIT}`,
            `- build exit: ${process.env.BUILD_EXIT}`,
            '',
            '## Lint', '', fence(tail('lint.log')), '',
            '## Typecheck', '', fence(tail('typecheck.log')), '',
            '## Build', '', fence(tail('build.log')), ''
          ].join('\n');
          fs.writeFileSync('docs/DEPENDENCY_VALIDATION_2026-10-19.md', md);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n${md}`);
          NODE

      - name: Commit regenerated lockfile and evidence
        run: |
          if git diff --quiet -- package-lock.json docs/DEPENDENCY_AUDIT_2026-10-19.md docs/DEPENDENCY_VALIDATION_2026-10-19.md; then
            echo "Lockfile and validation evidence already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json docs/DEPENDENCY_AUDIT_2026-10-19.md docs/DEPENDENCY_VALIDATION_2026-10-19.md
            git commit -m "security: regenerate lockfile and record validation"
            git push
          fi

      - name: Enforce validation gates
        env:
          LINT_EXIT: ${{ steps.lint.outputs.exit_code }}
          TYPECHECK_EXIT: ${{ steps.typecheck.outputs.exit_code }}
          BUILD_EXIT: ${{ steps.build.outputs.exit_code }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          const v = audit.metadata?.vulnerabilities || {};
          const failures = [];
          if ((v.critical || 0) > 0 || (v.high || 0) > 0) failures.push(`production audit: ${v.critical || 0} critical, ${v.high || 0} high`);
          if (process.env.LINT_EXIT !== '0') failures.push(`lint exit ${process.env.LINT_EXIT}`);
          if (process.env.TYPECHECK_EXIT !== '0') failures.push(`typecheck exit ${process.env.TYPECHECK_EXIT}`);
          if (process.env.BUILD_EXIT !== '0') failures.push(`build exit ${process.env.BUILD_EXIT}`);
          if (failures.length) {
            console.error(`Validation gate failed: ${failures.join('; ')}`);
            process.exit(1);
          }
          NODE
